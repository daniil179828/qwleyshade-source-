.bg::after{content:"";position:absolute;inset:0;background:rgba(8,8,10,.78)}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(70% 60% at 50% 45%,transparent,rgba(6,6,8,.85))}


.rays{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.ray{position:absolute;top:-40vh;left:50%;width:26vw;height:190vh;transform-origin:top center;
  background:linear-gradient(to bottom,rgba(255,196,130,.5),rgba(255,170,90,.16) 42%,transparent 78%);
  filter:blur(38px);mix-blend-mode:screen;animation:sway 11s ease-in-out infinite alternate}
.r1{transform:translateX(-60%) rotate(16deg);opacity:.75}
.r2{width:12vw;transform:translateX(-140%) rotate(22deg);opacity:.45;animation-duration:14s;animation-delay:-3s}
.r3{width:8vw;transform:translateX(60%) rotate(11deg);opacity:.3;animation-duration:17s;animation-delay:-6s}
.glare{position:fixed;top:-22vh;left:42%;width:60vw;height:60vh;z-index:1;pointer-events:none;
  background:radial-gradient(circle,rgba(255,190,120,.22),transparent 62%);filter:blur(30px);mix-blend-mode:screen}
@keyframes sway{from{filter:blur(38px) opacity(.75)}to{filter:blur(52px) opacity(1)}}


.sun{position:fixed;top:-90px;left:22%;width:300px;height:300px;z-index:1;pointer-events:none;
  mix-blend-mode:screen;filter:blur(2px);animation:pulse 6s ease-in-out infinite alternate}
.sun::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,rgba(255,231,180,.95) 14%,rgba(255,178,90,.55) 30%,rgba(255,140,60,.18) 52%,transparent 72%)}
.sun::after{content:"";position:absolute;left:50%;top:50%;width:150%;height:3px;transform:translate(-50%,-50%);
  background:linear-gradient(90deg,transparent,rgba(255,220,170,.7),transparent);filter:blur(2px)}
.streak{position:fixed;top:60px;left:22%;width:120vw;height:2px;z-index:1;pointer-events:none;
  transform:translateX(-30%) rotate(-8deg);mix-blend-mode:screen;filter:blur(3px);
  background:linear-gradient(90deg,transparent,rgba(255,200,140,.45) 20%,rgba(255,236,200,.75) 30%,rgba(255,190,120,.35) 45%,transparent 75%)}
.flare{position:fixed;z-index:1;pointer-events:none;border-radius:50%;mix-blend-mode:screen;filter:blur(1px);
  animation:pulse 7s ease-in-out infinite alternate}
.f1{width:26px;height:26px;top:34%;left:41%;background:radial-gradient(circle,rgba(255,190,120,.5),transparent 70%)}
.f2{width:64px;height:64px;top:47%;left:52%;background:radial-gradient(circle,rgba(255,140,90,.28),transparent 68%);animation-delay:-2s}
.f3{width:16px;height:16px;top:56%;left:60%;background:radial-gradient(circle,rgba(255,225,170,.6),transparent 70%);animation-delay:-4s}
.f4{width:110px;height:110px;top:70%;left:72%;background:radial-gradient(circle,rgba(255,160,90,.16),transparent 66%);animation-delay:-1s}
@keyframes pulse{from{opacity:.7}to{opacity:1}}

.card{position:relative;z-index:2;width:100%;max-width:420px;text-align:center}
.logo{width:100px;height:100px;border-radius:22px;object-fit:cover;display:block;
  border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.6)}
h1{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;
  font-size:44px;letter-spacing:.01em;line-height:1.1}
p{color:#a09a93;font-size:15px;margin-top:12px}
.btns{display:grid;gap:11px;margin-top:34px}
/* полупрозрачное стекло */
a.b{display:block;padding:15px;border-radius:12px;font-size:14.5px;font-weight:500;
  letter-spacing:.01em;text-decoration:none;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  transition:background .2s ease, border-color .2s ease}
a.b:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.18)}
a.b:active{background:rgba(255,255,255,.05)}

.dl{color:#f6d9bd;background:rgba(232,133,58,.14);border-color:rgba(232,133,58,.28)}
.dl:hover{background:rgba(232,133,58,.22);border-color:rgba(232,133,58,.42)}
.tg{color:#ededef}
footer{margin-top:26px;font-size:13px;color:#79737c;font-family:'Playfair Display',serif;font-style:italic}


@media (pointer:fine){
  *{cursor:none !important}
  .cur{position:fixed;top:0;left:0;width:6px;height:6px;border-radius:50%;background:#fff;z-index:9999;
    pointer-events:none;transform:translate(-50%,-50%);mix-blend-mode:difference;
    box-shadow:0 0 8px rgba(255,255,255,.55);transition:width .18s,height .18s,opacity .18s}
  .cur-ring{position:fixed;top:0;left:0;width:20px;height:20px;border-radius:50%;
    border:1px solid rgba(255,255,255,.4);z-index:9998;pointer-events:none;transform:translate(-50%,-50%);
    transition:width .22s,height .22s,border-color .22s,opacity .22s}
  body.hov .cur{width:4px;height:4px}
  body.hov .cur-ring{width:30px;height:30px;border-color:rgba(255,190,120,.85)}
  body.click .cur-ring{width:14px;height:14px}
}


.logo-wrap{perspective:700px;width:100px;margin:0 auto 24px}
.logo{transition:transform .12s ease-out}
</style>
